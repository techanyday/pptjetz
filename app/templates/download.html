{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Your Presentation is Ready!</h2>
                    
                    <p class="lead mb-4">Click the button below to download your presentation.</p>
                    
                    <a id="downloadLink" href="{{ download_url }}" class="inline-flex items-center gap-2 mb-4 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md shadow">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v9a1 1 0 11-2 0V4H5v8a1 1 0 11-2 0V3zm3 10a1 1 0 011-1h2V6a1 1 0 112 0v6h2a1 1 0 01.707 1.707l-3 3a1 1 0 01-1.414 0l-3-3A1 1 0 016 13z" clip-rule="evenodd"/></svg>
                        Download Presentation
                    </a>

                    <!-- Ad: download_top -->
                    <ins class="adsbygoogle"
                         style="display:block; margin: 16px 0;"
                         data-ad-client="ca-pub-6405372608012962"
                         data-ad-slot="9445777349"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

<script>
// Analytics: download click
(function(){
  const a = document.getElementById('downloadLink');
  if (!a) return;
  a.addEventListener('click', function(){
    if (typeof gtag === 'function') {
      gtag('event', 'download_click', {
        event_category: 'file',
        event_label: 'pptx_download'
      });
    }
  });
})();
</script>

                    
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
