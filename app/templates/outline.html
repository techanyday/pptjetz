{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] py-6">
  <div class="max-w-[1280px] mx-auto grid grid-cols-1 xl:grid-cols-[300px_minmax(0,1fr)_300px] gap-6 px-4">
    <!-- Left sidebar ad (sticky) -->
    <aside class="hidden xl:block">
      <div class="sticky top-24">
        <div class="bg-white rounded shadow p-3 min-h-[600px] flex items-center justify-center" aria-label="Outline left ad slot">
          <ins class="adsbygoogle"
               style="display:block; width:100%; min-height:600px;"
               data-ad-client="ca-pub-6405372608012962"
               data-ad-slot="6845860007"
               data-ad-format="auto"
               data-full-width-responsive="true"></ins>
        </div>
      </div>
    </aside>

    <!-- Main column -->
    <main>
      <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Outline Preview</h1>
  <style>
    /* Outline card styles */
    .ol-item{display:flex;align-items:center;gap:.75rem;background:#fff;border:1px solid #e5e7eb;border-radius:.5rem;padding:.75rem 1rem;}
    .ol-item + .ol-item{margin-top:.75rem}
    .ol-num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:9999px;background:#ebf5ff;color:#1d4ed8;font-weight:700;font-size:.9rem;border:1px solid #bfdbfe}
    .ol-title{font-weight:600;color:#111827}
    .ol-item:hover{box-shadow:0 4px 10px rgba(0,0,0,.05);border-color:#d1d5db}

    /* Meta card styles */
    .ol-meta{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:#f8fafc;border:1px solid #e5e7eb;border-radius:.5rem;padding:.75rem 1rem}
    .ol-meta-title{font-weight:700;color:#0f172a}
    .ol-meta-sub{color:#334155;font-size:.9rem}
    .ol-pill{display:inline-flex;align-items:center;gap:.25rem;background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe;border-radius:9999px;padding:.125rem .5rem;font-weight:600}
  </style>
  <div id="meta" class="text-gray-600 mb-4"></div>
  <!-- Ad: outline_top (replace data-ad-slot) -->
  <ins class="adsbygoogle"
       style="display:block; margin: 16px 0;"
       data-ad-client="ca-pub-6405372608012962"
       data-ad-slot="2030036349"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  <div id="topics" class="mt-4"></div>
  <div class="mt-6 flex items-center gap-3">
    <button id="exportBtn" class="bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700">Export PPTX</button>
    <a href="{{ url_for('main.generate_page') }}" class="px-5 py-2 rounded border hover:bg-gray-50">Back</a>
  </div>
  <!-- Ad: outline_bottom (moved below buttons) -->
  <ins class="adsbygoogle"
       style="display:block; margin: 16px 0;"
       data-ad-client="ca-pub-6405372608012962"
       data-ad-slot="7609951498"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </main>

    <!-- Right sidebar ad (sticky) -->
    <aside class="hidden xl:block">
      <div class="sticky top-24">
        <div class="bg-white rounded shadow p-3 min-h-[600px] flex items-center justify-center" aria-label="Outline right ad slot">
          <ins class="adsbygoogle"
               style="display:block; width:100%; min-height:600px;"
               data-ad-client="ca-pub-6405372608012962"
               data-ad-slot="6055328998"
               data-ad-format="auto"
               data-full-width-responsive="true"></ins>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
(async function(){
  const deckId = {{ deck_id|tojson }};
  const metaEl = document.getElementById('meta');
  const topicsEl = document.getElementById('topics');
  const exportBtn = document.getElementById('exportBtn');

  function renderOutline(deck){
    const title = deck.deck_title || 'Untitled';
    const theme = deck.theme_name || 'SLEEK';
    // Build meta card safely using textContent assignments
    metaEl.innerHTML = `
      <div class="ol-meta">
        <div id="olTitle" class="ol-meta-title"></div>
        <div class="ol-meta-sub">Theme: <span class="ol-pill" id="olTheme"></span></div>
      </div>`;
    const olTitle = document.getElementById('olTitle');
    const olTheme = document.getElementById('olTheme');
    if (olTitle) olTitle.textContent = title;
    if (olTheme) olTheme.textContent = theme;

    const slides = Array.isArray(deck.slides) ? deck.slides : [];
    // Use agenda bullets if present, else use slide titles
    let topics = [];
    const agenda = slides.find(s => (s.type||'').toLowerCase() === 'agenda');
    if (agenda && agenda.content && Array.isArray(agenda.content.bullets)) {
      topics = agenda.content.bullets;
    } else {
      topics = slides
        .filter(s => !['title','agenda','thank_you','cta'].includes((s.type||'').toLowerCase()))
        .map(s => s.title).filter(Boolean);
    }
    if (!topics.length) {
      topicsEl.innerHTML = '<div class="text-gray-500">No topics found.</div>';
      return;
    }
    const list = topics.map((t,i)=>`
      <div class="ol-item" role="listitem">
        <span class="ol-num">${i+1}</span>
        <div class="ol-title">${t}</div>
      </div>
    `).join('');
    topicsEl.innerHTML = `<div role="list" aria-label="Outline topics">${list}</div>`;
  }

  async function loadDeck(){
    const resp = await fetch(`/api/decks/${deckId}`);
    if (!resp.ok) { topicsEl.innerHTML = '<div class="text-red-600">Deck not found.</div>'; return; }
    const data = await resp.json();
    renderOutline(data);
  }

  exportBtn.addEventListener('click', async () => {
    exportBtn.disabled = true; exportBtn.textContent = 'Exporting...';
    // Analytics: export clicked
    if (typeof gtag === 'function') {
      gtag('event', 'export_click', {
        event_category: 'engagement',
        event_label: 'outline_export',
        value: 0.009,
        currency: 'USD',
        export_value: 0.009
      });
    }
    try {
      const resp = await fetch('/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ deck_id: deckId })
      });
      const data = await resp.json();
      if (data && data.ok && data.deck_id) {
        // Redirect to dedicated download page
        window.location.assign(`/download_page/${data.deck_id}`);
      } else if (data && data.download_url) {
        // Fallback: direct download link
        window.location.assign(data.download_url);
      } else {
        alert((data && data.error) || 'Export failed');
      }
    } catch (e) {
      console.error(e);
      alert('Export failed');
    } finally {
      exportBtn.disabled = false; exportBtn.textContent = 'Export PPTX';
    }
  });

  loadDeck();
})();
</script>
{% if ADS_ENABLED and ADSENSE_ENABLED %}
<script>
// Trigger AdSense requests for all slots (including sidebars) after load
try {
  const push = () => { try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) { console.warn('adsbygoogle push failed', e); } };
  if (document.readyState === 'complete') { setTimeout(() => document.querySelectorAll('ins.adsbygoogle').forEach(() => push()), 150); }
  else { window.addEventListener('load', () => setTimeout(() => document.querySelectorAll('ins.adsbygoogle').forEach(() => push()), 150), { once: true }); }
} catch (e) { console.warn(e); }
</script>
{% endif %}
{% endblock %}
