{% extends "base.html" %}
{% block title %}{{ title or 'Error' }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl p-6 ring-1 ring-black/5">
  <h1 class="text-2xl font-bold text-red-600 mb-2">{{ title or 'Error' }}</h1>
  {% if message %}
  <p class="text-slate-700 mb-4">{{ message }}</p>
  {% endif %}
  {% if details %}
  <pre class="text-xs bg-slate-50 p-3 rounded overflow-x-auto">{{ details | tojson(indent=2) }}</pre>
  {% endif %}
  <div class="mt-6">
    <a href="{{ url_for('main.home') }}" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Go Home</a>
  </div>
</div>
{% endblock %}
