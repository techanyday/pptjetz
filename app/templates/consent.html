{% extends "base.html" %}

{% block title %}Marketing Preferences - PPTJet{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
  <h1 class="text-2xl font-semibold mb-2">Stay connected</h1>
  <p class="text-gray-600 mb-4">Get occasional updates, new features, and tips to help you get the most out of PPTJet. You can unsubscribe anytime.</p>

  {% if error %}
  <div class="p-3 bg-red-50 text-red-700 rounded mb-3">{{ error }}</div>
  {% endif %}

  <form method="post">
    <label class="inline-flex items-center">
      <input type="checkbox" name="opt_in" value="1" class="mr-2">
      <span>I agree to receive emails from PPTJet.</span>
    </label>
    <input type="hidden" name="consent_text" value="I agree to receive emails from PPTJet.">
    <div class="mt-6">
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Continue</button>
    </div>
  </form>
</div>
{% endblock %}
