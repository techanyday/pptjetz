{% extends "base.html" %}

{% block content %}
<style>
.template-option{display:none !important;}
</style>
<script>
  // Rendered by server: true when global limits are disabled
  // Wrap in string + JSON.parse so IDE JS linter doesn't choke on template braces
  const DISABLE_LIMITS = JSON.parse('{{ disable_limits | tojson | safe }}');
  console.log('DISABLE_LIMITS:', DISABLE_LIMITS);
  // When DISABLE_LIMITS is true, we will not show upgrade modal on 403
</script>
<div class="max-w-4xl mx-auto">
    <div class="bg-white shadow-xl rounded-lg p-6">
        <h1 class="text-3xl font-bold text-center mb-4">AI PowerPoint Generator</h1>
        
        
        
        <!-- Removed duplicate caption and plan label UI -->
        
        <form id="presentationForm" class="space-y-6">
            <!-- Number of Slides control hidden to preserve logic -->
            <input type="hidden" id="num_slides" name="num_slides" value="7">
            
            <div>
                <label for="prompt" class="block text-sm font-medium text-gray-700 mb-2">What should the presentation be about?</label>
                <textarea id="prompt" name="prompt" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required></textarea>
            </div>
            
            
                    <div class="template-option cursor-pointer" data-template="Aesthetic">
                        <img src="{{ url_for('static', filename='img/templates/aesthetic.jpg') }}" alt="Aesthetic template" class="w-full h-32 object-cover rounded-lg" />
                        <p class="text-center mt-2">Aesthetic</p>
                    </div>
                    
                        
                        
                    <div class="template-option cursor-pointer" data-template="Vintage">
                        <img src="{{ url_for('static', filename='img/templates/vintage.jpg') }}" alt="Vintage template" class="w-full h-32 object-cover rounded-lg" />
                        <p class="text-center mt-2">Vintage</p>
                    </div>
                    
                        
                        
                    <div class="template-option cursor-pointer" data-template="Creative">
                        <img src="{{ url_for('static', filename='img/templates/creative.jpg') }}" alt="Creative template" class="w-full h-32 object-cover rounded-lg" />
                        <p class="text-center mt-2">Creative</p>
                    </div>
                    
                        
                        
                    <div class="template-option cursor-pointer" data-template="Simple">
                        <img src="{{ url_for('static', filename='img/templates/simple.jpg') }}" alt="Simple template" class="w-full h-32 object-cover rounded-lg" />
                        <p class="text-center mt-2">Simple</p>
                    </div>

                    <div class="template-option cursor-pointer" data-template="Business">
                        <img src="{{ url_for('static', filename='img/templates/Business.png') }}" alt="Business template" class="w-full h-32 object-cover rounded-lg" />
                        <p class="text-center mt-2">Business</p>
                    </div>

                    <div class="template-option cursor-pointer" data-template="Neat and Clean">
                        <img src="{{ url_for('static', filename='img/templates/Clean and Neat.png') }}" alt="Clean and Neat template" class="w-full h-32 object-cover rounded-lg" />
                        <p class="text-center mt-2">Neat and Clean</p>
                    </div>
<div>
                <label for="theme" class="block text-sm font-medium text-gray-700 mb-2">Choose Theme</label>
                <select id="theme" name="theme" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <option value="SLEEK">SLEEK</option>
                    <option value="PULSE">PULSE</option>
                    <option value="MINIMAL FLUX">MINIMAL FLUX</option>
                    <option value="BLUE HORIZON">BLUE HORIZON</option>
                </select>
            </div>
            
            <!-- Include Images control visually hidden to preserve logic (JS reads .checked) -->
            <div class="hidden">
                <input type="checkbox" id="include_images" class="mr-2 h-4 w-4" checked>
                <label for="include_images">Include Images</label>
            </div>
            
            <div class="text-center">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Generate Presentation
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Preview Section -->
<div id="previewSection" class="max-w-4xl mx-auto mt-8 hidden">
  <div class="bg-white shadow-xl rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-4">Presentation Outline</h2>
    <div id="slidesPreview" class="space-y-4"></div>
    <div class="text-center mt-6">
      <button id="exportBtn" class="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700">Export PPTX</button>
    </div>
  </div>
</div>

<script>
// Skeletons
// Globals to share state between generate and export handlers
let lastSlides = null;
let lastThemeName = null;
let lastTitle = '';
function showSkeletons(count = 6) {
    const container = document.getElementById('slidesPreview');
    const cards = Array.from({length: count}).map(() => `
      <div class="border rounded-lg p-2 animate-pulse">
        <div class="h-4 w-24 bg-gray-200 rounded mb-2"></div>
        <div class="w-full h-40 bg-gray-200 rounded"></div>
      </div>
    `).join('');
    container.innerHTML = `<div class="grid grid-cols-1 gap-4 md:grid-cols-2">${cards}</div>`;
    const section = document.getElementById('previewSection');
    section.classList.remove('hidden');
}

function showEmptyState() {
    const container = document.getElementById('slidesPreview');
    container.innerHTML = `<div class="text-gray-600 text-center py-8">No previews yet. Click <span class="font-semibold">Export PPTX</span> to generate.</div>`;
    const section = document.getElementById('previewSection');
    section.classList.remove('hidden');
}

function renderPreview(slides) {
    const container = document.getElementById('slidesPreview');
    const section = document.getElementById('previewSection');
    if (!slides || !Array.isArray(slides) || slides.length === 0) {
        section.classList.add('hidden');
        container.innerHTML = '';
        return;
    }
    const html = slides.map((s, idx) => {
        const title = s.title || s.type || `Slide ${idx+1}`;
        const bullets = (s.content && (s.content.bullets || s.content.points)) || [];
        const bulletHtml = Array.isArray(bullets) ? bullets.map(b => `<li class=\"list-disc ml-5\">${b}</li>`).join('') : '';
        return `
          <div class=\"border rounded-lg p-4\">\n                <div class=\"text-sm text-gray-500\">${idx+1}</div>\n                <h3 class=\"text-lg font-semibold\">${title}</h3>\n                ${bulletHtml ? `<ul class=\"mt-2\">${bulletHtml}</ul>` : ''}\n              </div>`;
    }).join('');
    container.innerHTML = html;
    section.classList.remove('hidden');
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Thumbnails rendering
function renderThumbnails(slideList) {
    const container = document.getElementById('slidesPreview');
    if (!Array.isArray(slideList) || slideList.length === 0) {
        showEmptyState();
        return;
    }
    const now = Date.now();
    const grid = slideList.map((s) => {
      const url = s.url ? `${s.url}${s.url.includes('?') ? '&' : '?'}v=${now}-${s.n || ''}` : '';
      return `
      <div class="border rounded-lg p-2 cursor-pointer group" data-index="${s.n}">
        <div class="text-xs text-gray-500 mb-1">Slide ${s.n}</div>
        <div class="w-full bg-gray-50 rounded border overflow-hidden">
          <img loading="lazy" src="${url}" alt="Slide ${s.n}" class="w-full h-48 object-contain bg-gray-100 group-hover:opacity-95 transition" />
        </div>
      </div>
    `}).join('');
    container.innerHTML = `<div class="grid grid-cols-1 gap-4 md:grid-cols-2">${grid}</div>`;

    // Click handlers for lightbox
    container.querySelectorAll('[data-index]').forEach(el => {
        el.addEventListener('click', () => openLightbox(parseInt(el.getAttribute('data-index'))));
    });
    document.getElementById('previewSection').classList.remove('hidden');
}

async function fetchAndRenderPreviews(deckId) {
    showSkeletons();
    try {
        const resp = await fetch(`/api/previews/${deckId}`);
        if (resp.status === 404) { console.warn('API previews 404 for deck', deckId); showEmptyState(); return; }
        const data = await resp.json();
        console.log('API previews count:', data && data.count);
        renderThumbnails(data.slides || []);
    } catch (e) {
        console.error('Failed to load previews', e);
        showEmptyState();
    }
}

// Lightbox modal
const lightbox = document.createElement('div');
lightbox.id = 'lightboxModal';
lightbox.className = 'fixed inset-0 z-50 hidden';
lightbox.innerHTML = `
  <div class="absolute inset-0 bg-black/70"></div>
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div class="relative bg-white rounded-lg shadow-xl max-w-5xl w-full p-4">
      <button id="lbClose" class="absolute top-2 right-2 text-gray-600 hover:text-black" aria-label="Close">✕</button>
      <div class="flex items-center gap-4">
        <button id="lbPrev" class="px-3 py-2 rounded bg-gray-100 hover:bg-gray-200" aria-label="Previous">◀</button>
        <img id="lbImage" src="" alt="Slide" class="max-h-[70vh] w-full object-contain border rounded" />
        <button id="lbNext" class="px-3 py-2 rounded bg-gray-100 hover:bg-gray-200" aria-label="Next">▶</button>
      </div>
      <div id="lbCaption" class="mt-2 text-center text-sm text-gray-600"></div>
    </div>
  </div>`;
document.body.appendChild(lightbox);

let lbIndex = 1;
let lbSlides = [];
function setLightbox(n) {
    if (!lbSlides.length) return;
    lbIndex = Math.max(1, Math.min(n, lbSlides.length));
    const s = lbSlides[lbIndex - 1];
    document.getElementById('lbImage').src = s.url;
    document.getElementById('lbCaption').textContent = `Slide ${s.n}`;
}
function openLightbox(n) {
    setLightbox(n);
    lightbox.classList.remove('hidden');
}
function closeLightbox() { lightbox.classList.add('hidden'); }
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => setLightbox(lbIndex - 1));
document.getElementById('lbNext').addEventListener('click', () => setLightbox(lbIndex + 1));
lightbox.addEventListener('click', (e) => { if (e.target === lightbox.firstChild) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (!lightbox.classList.contains('hidden') && e.key === 'Escape') closeLightbox(); });

document.getElementById('exportBtn').addEventListener('click', async function() {
    if (!lastSlides) {
        alert('Generate slides first.');
        return;
    }
    try {
        const resp = await fetch('/export', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deck_title: lastTitle, slides: lastSlides, theme_name: lastThemeName || document.getElementById('theme').value })
        });
        const data = await resp.json();
        if (data && data.ok) {
            const url = data.download_url;
            if (url) {
                // Auto-trigger download
                const a = document.createElement('a');
                a.href = url;
                a.download = 'presentation.pptx';
                document.body.appendChild(a);
                a.click();
                a.remove();
                // Also show a persistent link below preview
                const dl = `<div class="text-center mt-6"><a href="${url}" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700" download>Download PPTX</a></div>`;
                const container = document.getElementById('slidesPreview');
                container.insertAdjacentHTML('beforeend', dl);
                document.getElementById('previewSection').classList.remove('hidden');
                document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                alert('Export succeeded but no download URL returned');
            }
        } else {
            const detail = data && data.details ? `\nDetails: ${data.details}` : '';
            const stderr = data && data.stderr ? `\nLog: ${data.stderr}` : '';
            alert((data && data.error ? data.error : 'Export failed') + detail + stderr);
        }
    } catch (e) {
        console.error(e);
        alert('Export failed');
    }
});


// Form submission
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('presentationForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitButton = this.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.innerHTML = 'Generating...';
        
        const formData = {
            title: '',
            subtitle: '',
            presenter: '{{ user.name }}',
            date: '',
            input_text: document.getElementById('prompt').value,
            num_slides: parseInt(document.getElementById('num_slides').value),
            theme_name: document.getElementById('theme').value,
            include_images: document.getElementById('include_images').checked
        };

        try {
            const response = await fetch('/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                body: JSON.stringify(formData)
            });
            
            const data = await response.json();
            console.log('Generate response:', response.status, data);
            
            // Multi-page flow: if backend returned redirect_url, go there
            if (data && data.redirect_url) {
                window.location.assign(data.redirect_url);
                return;
            }

            if ((data && data.ok) || (data && Array.isArray(data.slides) && data.slides.length)) {
                console.log('Slides generated:', data.slides);
                lastSlides = data.slides;
                lastThemeName = data.theme_name || document.getElementById('theme').value;
                // Prefer AI-generated title from first slide; fallback to submitted title or generic
                lastTitle = (Array.isArray(data.slides) && data.slides.length && typeof data.slides[0]?.title === 'string' && data.slides[0].title.trim())
                  ? data.slides[0].title.trim()
                  : (formData.title || 'Generated Presentation');
                renderPreview(lastSlides);
            } else {
                if (data && Array.isArray(data.errors) && data.errors.length) {
                    alert(`Slide issues:\n- ${data.errors.join('\n- ')}`);
                } else {
                    alert(data && data.error ? data.error : 'Error generating presentation');
                }
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error generating presentation');
        } finally {
            submitButton.disabled = false;
            submitButton.innerHTML = 'Generate Presentation';
        }
    });
});
</script>
{% endblock %}
