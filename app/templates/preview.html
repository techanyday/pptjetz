{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto p-4">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold">Presentation Preview</h1>
    <div class="flex items-center gap-2">
      <a id="downloadLink" href="#" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Download PPTX</a>
      <a href="{{ url_for('main.generate_page') }}" class="px-4 py-2 rounded border hover:bg-gray-50">Back</a>
    </div>
  </div>

  <div id="viewer" class="bg-white shadow rounded p-4">
    <div class="flex items-center gap-4 justify-center">
      <button id="prevBtn" class="px-3 py-2 rounded bg-gray-100 hover:bg-gray-200" aria-label="Previous">◀</button>
      <img id="slideImage" src="" alt="Slide" class="max-h-[78vh] w-full object-contain border rounded" />
      <button id="nextBtn" class="px-3 py-2 rounded bg-gray-100 hover:bg-gray-200" aria-label="Next">▶</button>
    </div>
    <div class="mt-3 flex items-center justify-center gap-3 text-sm text-gray-600">
      <span id="pos">1 / 1</span>
      <span>•</span>
      <span id="caption">Slide 1</span>
    </div>
  </div>
</div>

<script>
(function() {
  const deckId = {{ deck_id|tojson }};
  const imageEl = document.getElementById('slideImage');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const posEl = document.getElementById('pos');
  const captionEl = document.getElementById('caption');
  const downloadLink = document.getElementById('downloadLink');

  // Construct predictable download URL (export uses deck_<id>.pptx)
  downloadLink.href = `/download/${deckId}/deck_${deckId}.pptx`;

  let slides = [];
  let idx = 0; // zero-based

  function setIndex(n) {
    if (!slides.length) return;
    idx = Math.max(0, Math.min(n, slides.length - 1));
    const s = slides[idx];
    const bust = `${Date.now()}-${s.n || (idx+1)}`;
    const imgUrl = s.url ? `${s.url}${s.url.includes('?') ? '&' : '?'}v=${bust}` : '';
    imageEl.src = imgUrl;
    captionEl.textContent = s.title || `Slide ${s.n}`;
    posEl.textContent = `${idx + 1} / ${slides.length}`;
  }

  function next() { setIndex(idx + 1); }
  function prev() { setIndex(idx - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  async function loadSlides() {
    try {
      const resp = await fetch(`/api/previews/${deckId}`);
      if (!resp.ok) {
        alert('No previews found for this deck.');
        return;
      }
      const data = await resp.json();
      slides = data.slides || [];
      if (!slides.length) {
        alert('No slides to preview');
        return;
      }
      setIndex(0);
    } catch (e) {
      console.error(e);
      alert('Failed to load preview images');
    }
  }

  loadSlides();
})();
</script>
{% endblock %}
