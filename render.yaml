services:
  # Development Environment
  - type: web
    name: pptjet-dev
    env: python
    region: ohio
    plan: free
    branch: develop
    buildCommand: |
      apt-get update
      apt-get install -y libreoffice poppler-utils
      mkdir -p public/static/images/templates
      cp -r app/static/images/templates/* public/static/images/templates/
      pip install -r requirements.txt
    staticPublishPath: ./public/static
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_API_TOKEN
        sync: false
      - key: FLASK_ENV
        value: development
      - key: ENVIRONMENT
        value: development

  # Production Environment
  - type: web
    name: pptjet
    env: python
    region: ohio
    plan: free
    branch: main
    buildCommand: |
      apt-get update
      apt-get install -y libreoffice poppler-utils
      mkdir -p public/static/images/templates
      cp -r app/static/images/templates/* public/static/images/templates/
      pip install -r requirements.txt
    staticPublishPath: ./public/static
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_API_TOKEN
        sync: false
      - key: FLASK_ENV
        value: production
      - key: ENVIRONMENT
        value: production
