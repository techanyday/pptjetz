services:
  # Development Environment
  - type: web
    name: pptjet-dev
    runtime: docker
    region: ohio
    plan: free
    branch: develop
    dockerfilePath: ./Dockerfile
    dockerCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_API_TOKEN
        sync: false
      - key: FLASK_ENV
        value: development
      - key: ENVIRONMENT
        value: development

  # Production Environment
  - type: web
    name: pptjet
    runtime: docker
    region: ohio
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_API_TOKEN
        sync: false
      - key: FLASK_ENV
        value: production
      - key: ENVIRONMENT
        value: production
